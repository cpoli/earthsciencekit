name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes the run in progress; every run on
# the default branch finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      # fail_under=100 and branch=true in pyproject.toml make this the
      # statement and branch coverage gate.
      - run: MPLBACKEND=Agg python -m pytest --cov=earthsciencekit --cov-report=term-missing

  minimum-versions:
    # The dependency floors in pyproject.toml, installed exactly. pyparsing is
    # held to its 2023 releases because newer ones emit a deprecation warning
    # from inside matplotlib 3.6, which filterwarnings=error turns into a failure.
    name: Test (py3.10, minimum dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -e ".[test]" "numpy==1.24.0" "scipy==1.10.0" "matplotlib==3.6.0" "pyparsing<3.1"
      - run: MPLBACKEND=Agg python -m pytest

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . "mypy>=1.10"
      - run: mypy earthsciencekit --ignore-missing-imports --follow-imports=silent --check-untyped-defs

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
