name: Release

# Push a tag vX.Y.Z to release. The tag must match
# `earthsciencekit.__version__` and `version` in pyproject.toml (kept equal
# by tests/test_core.py::test_version), CITATION.cff's `version`, and a
# "## [X.Y.Z] - date" section in CHANGELOG.md. The workflow then publishes
# to PyPI, creates the GitHub Release with that CHANGELOG section as its
# notes, and deploys the docs to gh-pages.
#
# One-time setup on the services:
# - PyPI: add a pending GitHub trusted publisher for the project
#   earthsciencekit (owner cpoli, repository earthsciencekit, workflow
#   release.yml, environment pypi). No API token is stored in the repository.
# - GitHub: the environment "pypi" in the repository settings, and Pages
#   served from the gh-pages branch.
# - Zenodo: enable the repository at zenodo.org/account/settings/github;
#   every GitHub Release is then archived with its own version DOI.
#
# Zenodo mints the version DOI only after the GitHub Release, so the job
# zenodo-doi waits for it, then writes it to CITATION.cff and the README
# badge in a commit on main.

on:
  push:
    tags: ["v*"]

env:
  # Zenodo concept record of earthsciencekit: all its versions share it.
  # Cite the version DOI, never this one.
  ZENODO_CONCEPT: "23441033"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches package version
        run: |
          version=${GITHUB_REF_NAME#v}
          test -f "dist/earthsciencekit-$version.tar.gz"
          test -f "dist/earthsciencekit-$version-py3-none-any.whl"
          grep -qx "__version__ = \"$version\"" earthsciencekit/__init__.py
      - name: Tag matches CITATION.cff
        run: |
          grep -qx "version: ${GITHUB_REF_NAME#v}" CITATION.cff
      # Checked before publishing, so a missing section cannot leave a
      # release on PyPI without its GitHub Release.
      - name: Release notes from the CHANGELOG section
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## [" v "] ") == 1) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/earthsciencekit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: notes
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "earthsciencekit ${GITHUB_REF_NAME#v}"
          --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  zenodo-doi:
    name: Record the Zenodo version DOI
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Wait for the Zenodo version DOI
        run: |
          query="https://zenodo.org/api/records?q=conceptrecid:${ZENODO_CONCEPT}&all_versions=true&sort=mostrecent&size=25"
          for attempt in $(seq 60); do
            doi=$(curl -sf "$query" | jq -r --arg v "$GITHUB_REF_NAME" \
              '.hits.hits[] | select(.metadata.version == $v) | .doi' | head -1) || true
            if [ -n "$doi" ]; then
              echo "DOI=$doi" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 60
          done
          echo "Zenodo has not archived $GITHUB_REF_NAME after an hour" >&2
          exit 1
      - name: Write the DOI to CITATION.cff and the README badge
        run: |
          python3 - <<'PY'
          import os, re
          doi = os.environ["DOI"]
          cff = open("CITATION.cff").read()
          if re.search(r"(?m)^doi: ", cff):
              cff = re.sub(r"(?m)^doi: .*$", "doi: " + doi, cff)
          else:
              cff = re.sub(r"(?m)^(date-released: .*)$", r"\1\ndoi: " + doi, cff)
          open("CITATION.cff", "w").write(cff)
          badge = ("[![DOI](https://zenodo.org/badge/DOI/{0}.svg)]"
                   "(https://doi.org/{0})".format(doi))
          readme = open("README.md").read()
          readme, n = re.subn(r"\[!\[DOI\]\([^)]*\)\]\([^)]*\)", lambda m: badge, readme)
          assert n == 1, "expected one DOI badge in README.md, found {}".format(n)
          open("README.md", "w").write(readme)
          PY
          git diff
      - name: Commit and push to main
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add the Zenodo DOI of ${GITHUB_REF_NAME#v} to CITATION.cff and the README badge"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  docs:
    name: Deploy the docs
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: cd docs && make html
      - run: touch docs/build/html/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: docs/build/html
          commit_message: "Rebuild docs for ${{ github.ref_name }}"
